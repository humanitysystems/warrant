server:
  host: 127.0.0.1
  adminPort: 8787

storage:
  path: warrant.db

policies:
  defaultAction: allow
  confirmTimeoutMs: 120000
  rules:
    - id: no-writes
      effect: block
      match: 'write'
    - id: confirm-publish
      effect: confirm
      match: 'publish'

downstream:
  - name: demo
    transport: stdio
    command: node
    args:
      - ./fixtures/demo-server.mjs
  - name: demo-http
    transport: http
    url: http://127.0.0.1:8907/mcp
